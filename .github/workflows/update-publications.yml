name: update-publications

# 每周一 03:17 UTC 自动更新 Publication 页面数据库(也可手动触发):
#   1. 拉取 OpenAlex 作者档案,过滤"一作/通讯(末位)作者"的英文论文
#   2. 合并新论文到 publications.json
#   3. 重新生成 publication.qmd
#   4. 有变更则提交推送到 main
# 发布到 GitHub Pages 仍走现有手动流程(scripts/publish-gh-pages-safe.sh),
# 因为 CI 里完整渲染全站需要 R 环境 + _freeze 缓存,见 CLAUDE.md。

on:
  schedule:
    - cron: "17 3 * * 1"   # Monday 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update publication database
        run: python3 scripts/update_publications.py

      - name: Commit changes if any
        run: |
          if git diff --quiet -- publications.json publication.qmd; then
            echo "No publication changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json publication.qmd
          git commit -m "chore: auto-update publications [skip ci]"
          git push
