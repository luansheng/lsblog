project:
  type: website
  post-render: scripts/filter-rss.R
  # Whitelist what gets rendered: root .md files (CLAUDE.md, PUBLISH-SOP.md)
  # and any stray dirs (e.g. a rweekly.org checkout) are left out of _site.
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  description: "A blog built with Quarto"
  site-url: https://luansheng.github.io/lsblog 
  title: "metabreeding"
  navbar:
    right:
      - about.qmd
      - publication.qmd
      - text: R-bloggers
        href: https://www.r-bloggers.com
      - icon: github
        href: https://github.com/
      - icon: twitter
        href: https://twitter.com
format:
  html:
    theme:
      - simplex
      - brand
    css: styles.css



